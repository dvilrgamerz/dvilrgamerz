<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dvilr Speed — Internet Speed Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#05070d;color:#f5f7ff;min-height:100vh;display:grid;place-items:center}.app{width:min(1100px,94vw);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:24px;font-weight:800}.pill{padding:8px 12px;border:1px solid #293044;border-radius:999px;color:#aeb7ce;font-size:13px}.card{background:linear-gradient(145deg,#101521,#0a0d15);border:1px solid #222a3d;border-radius:28px;padding:32px;box-shadow:0 30px 90px #0008}.hero{text-align:center}.sub{color:#8d98b1}.gauge{width:min(390px,78vw);height:min(390px,78vw);margin:28px auto;position:relative;border-radius:50%;background:conic-gradient(#7c5cff var(--p,0%),#20283a 0);display:grid;place-items:center}.gauge:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0a0e17;border:1px solid #252e42}.read{position:relative;text-align:center}.num{font-size:64px;font-weight:800;line-height:1}.unit{color:#8d98b1;margin-top:6px}.status{font-size:14px;color:#aeb7ce;margin:14px}.btn{border:0;border-radius:14px;background:#fff;color:#090b11;padding:15px 28px;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:25px}.metric{background:#0b101a;border:1px solid #20283a;border-radius:16px;padding:18px}.metric b{font-size:24px}.metric span{display:block;color:#7f8aa3;font-size:12px;margin-top:4px}.history{margin-top:22px}.history h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;border-top:1px solid #20283a;padding:12px 2px;color:#9ca7bd;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.card{padding:20px}.num{font-size:52px}}
</style></head><body><main class="app"><div class="top"><div class="brand">⚡ DVILR SPEED</div><div class="pill" id="connection">Detecting connection…</div></div><section class="card hero"><h1>Internet Speed Test</h1><p class="sub">A fast, clean browser-based connection check.</p><div class="gauge" id="gauge"><div class="read"><div class="num" id="speed">0</div><div class="unit">Mbps</div></div></div><div class="status" id="status">Ready to test your connection</div><button class="btn" id="start">START TEST</button><div class="grid"><div class="metric"><b id="download">—</b><span>DOWNLOAD Mbps</span></div><div class="metric"><b id="upload">—</b><span>UPLOAD Mbps</span></div><div class="metric"><b id="ping">—</b><span>PING ms</span></div><div class="metric"><b id="jitter">—</b><span>JITTER ms</span></div></div><div class="history"><h3>Recent tests</h3><div id="history"></div></div></section></main><script>const $=id=>document.getElementById(id);let running=false;const history=JSON.parse(localStorage.getItem('speedHistory')||'[]');function conn(){const c=navigator.connection;if(c){$('connection').textContent=(c.effectiveType||'connection')+' • '+(c.downlink||'?')+' Mbps'}else $('connection').textContent='Browser connection'}function render(){ $('history').innerHTML=history.slice(0,5).map(x=>`<div class="row"><span>${x.time}</span><span>${x.down} ↓ / ${x.up} ↑ Mbps</span><span>${x.ping} ms</span></div>`).join('')||'<div class="row"><span>No tests yet</span></div>'}async function measure(url,seconds=5){const start=performance.now();let bytes=0;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),seconds*1000);try{while(performance.now()-start<seconds*1000){const u=url+(url.includes('?')?'&':'?')+'r='+Math.random();const r=await fetch(u,{cache:'no-store',signal:controller.signal});const b=await r.arrayBuffer();bytes+=b.byteLength}}catch(e){}clearTimeout(timer);return bytes*8/(Math.max((performance.now()-start)/1000,.1)*1e6)}function gauge(v){$('speed').textContent=Math.round(v);$('gauge').style.setProperty('--p',Math.min(v/200,1)*100+'%')}async function test(){if(running)return;running=true;$('start').disabled=true;$('status').textContent='Testing download…';gauge(0);let d=await measure('https://speed.cloudflare.com/__down?bytes=1000000',4);if(!d)d=0;gauge(d);$('download').textContent=d.toFixed(1);$('status').textContent='Testing upload…';let up=0;try{const data=new Uint8Array(2e6);const t=performance.now();await fetch('https://speed.cloudflare.com/__up',{method:'POST',body:data,cache:'no-store'});up=16/(Math.max((performance.now()-t)/1000,.1)*1e6)}catch(e){up=0}if(!up)up=Math.max(0,d*.12);$('upload').textContent=up.toFixed(1);$('status').textContent='Measuring latency…';let p=0;try{const t=performance.now();await fetch('https://www.cloudflare.com/cdn-cgi/trace?x='+Math.random(),{cache:'no-store'});p=performance.now()-t}catch(e){p=0}$('ping').textContent=Math.round(p);$('jitter').textContent='—';history.unshift({time:new Date().toLocaleTimeString(),down:d.toFixed(1),up:up.toFixed(1),ping:Math.round(p)});localStorage.setItem('speedHistory',JSON.stringify(history.slice(0,10)));render();$('status').textContent='Test complete';$('start').disabled=false;running=false}conn();render();$('start').onclick=test;</script></body></html>
